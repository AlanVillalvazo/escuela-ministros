<style>
/* Layout: a missal-like study companion — one reading column, sticky tab bar, rubrics (instructions) in red as in the Missal */
:root{
  --paper:#F6F7F3; --card:#FFFFFF; --ink:#1B211D; --muted:#5B655F; --line:#DCE1D8;
  --rubric:#A31F1F; --rubric-soft:#F6E4E2; --gold:#9C7A22; --ok:#2E7048; --ok-soft:#E1F0E5; --bad:#B3261E; --bad-soft:#F9E3E1;
  --lc-verde:#2F7A4C; --lc-morado:#6B3E8E; --lc-blanco:#B9A26A; --lc-rojo:#B42B2B; --lc-rosa:#C9688E;
  --f-display:"Alegreya", "Iowan Old Style", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --r:10px; --host:#FFFCF2;
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--rubric);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:900px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:800;letter-spacing:.01em}
.brand b span{color:var(--rubric)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 12px 10px;border-bottom:3px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap;font-size:.95rem}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rubric)}

.season{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.season i{width:11px;height:11px;border-radius:50%;background:var(--lc-verde);display:inline-block;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line)}

main{max-width:900px;margin:0 auto;padding:28px 16px 64px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--rubric);font-weight:700}
.lead{font-size:1.12rem;color:var(--muted);max-width:62ch}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}

/* Inicio */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding-block:8px 28px;border-bottom:1px solid var(--line);margin-bottom:28px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;margin:6px 0 10px}
.hero h1 em{font-style:italic;font-weight:500;color:var(--rubric)}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1}
.ring .num small{font-family:var(--f-body);font-size:.72rem;color:var(--muted);font-weight:500;margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
@media (max-width:560px){.hero{grid-template-columns:1fr}.ring{width:112px;height:112px}}

.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.path{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .15s}
.path:hover{border-color:var(--rubric);transform:translateY(-1px)}
.path h3{font-size:1.2rem}
.path .meta{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Módulos */
.mods{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.mod{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:16px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.mod:hover .mod-t{color:var(--rubric)}
.mod-n{font-family:var(--f-display);font-size:2rem;font-weight:800;color:var(--rubric);line-height:1;text-align:center}
.mod-t{font-family:var(--f-display);font-size:1.2rem;font-weight:700;transition:color .15s}
.mod-s{font-size:.88rem;color:var(--muted)}
.pill{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.try{background:var(--rubric-soft);color:var(--rubric);border-color:transparent}

/* Lección */
.back{background:none;border:0;color:var(--muted);padding:0;font-size:.92rem;margin-bottom:14px}
.back:hover{color:var(--rubric)}
.lesson h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;margin:6px 0 12px}
.sec{margin-top:26px}
.sec h2{font-size:1.35rem;font-weight:700;margin-bottom:8px}
.sec ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:68ch}
.sec li::marker{color:var(--rubric)}
.keybox{margin-top:26px;padding:16px 18px;border-left:3px solid var(--gold);background:var(--card);border-radius:0 var(--r) var(--r) 0;max-width:68ch}
.keybox b{display:block;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.verse{font-family:var(--f-display);font-style:italic;font-size:1.25rem;color:var(--ink);margin:18px 0 0;max-width:60ch}
.verse cite{display:block;font-style:normal;font-family:var(--f-body);font-size:.82rem;color:var(--muted);margin-top:4px}

.rite{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;max-width:72ch}
.rite-step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.rite-step:last-child{border-bottom:0}
.rite-step .k{font-family:var(--f-display);font-weight:800;color:var(--rubric);font-size:1.15rem}
.rubric{color:var(--rubric);font-style:italic}
.say{font-weight:700;display:block;margin-top:2px}
.resp{display:block;margin-top:2px}
.resp::before{content:"R/. ";color:var(--rubric);font-weight:700}
.legend{font-size:.85rem;color:var(--muted);margin:0 0 10px}

.tbl{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.95rem;min-width:480px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* Quiz */
.quiz{margin-top:36px;padding-top:24px;border-top:2px solid var(--ink)}
.quiz h2{font-size:1.5rem;margin-bottom:4px}
.q{margin-top:22px}
.q p{font-weight:700;margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;transition:border-color .15s}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.why{font-size:.92rem;margin-top:8px;padding-left:12px;border-left:2px solid var(--line);color:var(--muted)}
.why strong{color:var(--ink)}
.result{margin-top:24px;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.result h3{font-size:1.3rem}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:10px 20px;font-weight:700}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--rubric);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.nav-mods{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}

/* Tarjetas */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 18px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.flip{perspective:1200px;max-width:560px;margin:0 auto}
.card3d{position:relative;width:100%;aspect-ratio:3/2;max-width:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;border:0;background:none;padding:0}
.card3d.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;gap:8px}
.face.back{transform:rotateY(180deg);border-color:var(--rubric)}
.face .term{font-family:var(--f-display);font-size:clamp(1.8rem,7vw,2.6rem);font-weight:800}
.face .cat{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--rubric);font-weight:700}
.face .def{font-size:1.1rem;max-width:40ch}
.face .hint{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.face .known{position:absolute;top:12px;right:14px;font-size:.75rem;color:var(--ok);font-weight:700}
.card-ctrl{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.count{text-align:center;color:var(--muted);font-size:.9rem;margin-top:10px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.card3d{transition:none}.path,.opt{transition:none}}

/* Situaciones */
.scen{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.scen .sit{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.3;margin:8px 0 16px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.cur{background:var(--ink)}

/* Ordena */
.order-picks{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.order-done{display:flex;flex-direction:column;gap:6px;margin-top:14px;counter-reset:s}
.order-done div{counter-increment:s;padding:9px 14px;border-radius:var(--r);background:var(--ok-soft);display:flex;gap:10px}
.order-done div::before{content:counter(s);font-family:var(--f-display);font-weight:800;color:var(--ok);min-width:1.2em}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.seg{display:flex;flex-wrap:wrap;gap:6px}

/* En la Misa: recorrido ilustrado */
.steps-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin:14px 0 6px;scrollbar-width:thin}
.st-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 5px 6px;font-size:.85rem;display:flex;align-items:center;gap:7px;white-space:nowrap}
.st-chip b{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--paper);font-size:.75rem;font-variant-numeric:tabular-nums}
.st-chip[aria-current="true"]{border-color:var(--rubric);color:var(--ink)}
.st-chip[aria-current="true"] b{background:var(--rubric);color:#fff}
.st-chip.seen b{background:var(--ok-soft);color:var(--ok)}
.ms-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:10px}
@media (max-width:760px){.ms-grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.scene svg,.plan svg,.mini svg{width:100%;height:auto;display:block}
.phase{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.ms-title{font-family:var(--f-display);font-size:1.6rem;font-weight:800;margin:4px 0 10px}
.ms-do{color:var(--rubric);font-style:italic;font-size:1.05rem}
.ms-say{margin-top:10px;padding:10px 14px;border-radius:var(--r);background:var(--paper)}
.ms-say .who{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block}
.ms-say strong{font-size:1.1rem}
.ms-note{margin-top:12px;font-size:.92rem;padding-left:12px;border-left:3px solid var(--gold);color:var(--muted)}
.ms-note b{color:var(--ink)}
.ms-tip{margin-top:10px;font-size:.92rem;color:var(--muted)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mini{border:1px solid var(--line);border-radius:var(--r);padding:8px;text-align:center;font-size:.85rem;color:var(--muted)}
.plan-cap{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.plan-cap i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.golden{margin-top:28px}
.golden ol{margin:8px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.golden li::marker{color:var(--rubric);font-family:var(--f-display);font-weight:800}
/* pictogramas */
.pg *{stroke-linecap:round;stroke-linejoin:round}
.pg .l{fill:none;stroke:var(--ink);stroke-width:2}
.pg .lm{fill:none;stroke:var(--muted);stroke-width:1.5}
.pg .ld{fill:none;stroke:var(--rubric);stroke-width:2;stroke-dasharray:5 5}
.pg .obj{fill:var(--card);stroke:var(--ink);stroke-width:2}
.pg .flr{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.pg .me{fill:var(--rubric);stroke:var(--ink);stroke-width:1.5}
.pg .pr{fill:var(--gold);stroke:var(--ink);stroke-width:1.5}
.pg .fi{fill:var(--line);stroke:var(--muted);stroke-width:1.5}
.pg .skin{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
.pg .gd{fill:var(--gold);stroke:var(--ink);stroke-width:1.5}
.pg .hst{fill:var(--host);stroke:var(--gold);stroke-width:1.5}
.pg .flame{fill:var(--rubric);stroke:none}
.pg .ray{stroke:var(--gold);stroke-width:2;fill:none}
.pg .bub{fill:var(--card);stroke:var(--muted);stroke-width:1.5}
.pg text{font-family:var(--f-body);fill:var(--ink);font-size:11px}
.pg text.tr{fill:var(--rubric);font-weight:700}
.pg text.tm{fill:var(--muted)}
.pg text.tw{fill:#fff;font-weight:700;font-size:10px}
.pg .hl{fill:var(--rubric-soft);stroke:var(--rubric);stroke-width:1.5}
.pg .a-me{stroke:var(--rubric);stroke-width:5;fill:none}
.pg .a-pr{stroke:var(--gold);stroke-width:5;fill:none}
.pg .a-fi{stroke:var(--line);stroke-width:5;fill:none}
.pg .arrowhead{fill:var(--rubric)}
.segc{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card);margin:14px 0 4px;flex-wrap:wrap}
.segc button{border:0;background:none;border-radius:999px;padding:7px 16px;font-weight:500;color:var(--muted)}
.segc button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.svc-list{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.svc{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
@media (max-width:620px){.svc{grid-template-columns:minmax(0,1fr)}.svc .pic{max-width:300px}}
.svc .pic svg{width:100%;height:auto;display:block}
.svc .when{display:inline-block;font-size:.78rem;font-weight:700;color:var(--rubric);background:var(--rubric-soft);border-radius:999px;padding:3px 10px;margin:6px 0 8px}
.svc h3{font-size:1.3rem}
.warn{margin-top:18px;padding:14px 16px;border-radius:var(--r);background:var(--rubric-soft);max-width:72ch}
.warn b{color:var(--rubric)}
/* Celebración de la Palabra */
.cp-hero{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:center}
@media (max-width:680px){.cp-hero{grid-template-columns:minmax(0,1fr)}.cp-hero .pic{max-width:300px}}
.cp-hero svg{width:100%;height:auto;display:block}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:22px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.fact b{display:block;font-family:var(--f-display);font-size:1.1rem;margin-bottom:4px}
.fact span{font-size:.92rem;color:var(--muted)}
.flow{display:flex;align-items:stretch;gap:0;margin-top:14px;overflow-x:auto;padding-bottom:6px}
.flow a{flex:1 0 120px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:10px 12px;position:relative;font-size:.9rem;line-height:1.25}
.flow a+a{margin-left:14px}
.flow a+a::before{content:"";position:absolute;left:-12px;top:50%;width:10px;border-top:2px solid var(--muted)}
.flow a:first-child{border-radius:var(--r) 0 0 var(--r)}.flow a:last-child{border-radius:0 var(--r) var(--r) 0}
.flow a b{display:block;font-family:var(--f-display);font-size:1.3rem;color:var(--rubric)}
.flow a.opt-part{border-style:dashed}
details.part{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.part summary{cursor:pointer;list-style:none;padding:14px 18px;display:flex;align-items:baseline;gap:12px}
details.part summary::-webkit-details-marker{display:none}
details.part summary b{font-family:var(--f-display);font-size:1.6rem;color:var(--rubric);line-height:1}
details.part summary span{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
details.part summary em{margin-left:auto;font-style:normal;font-size:.8rem;color:var(--muted)}
details.part .rite{border:0;border-top:1px solid var(--line);border-radius:0;max-width:none}
details.part .partnote{padding:10px 18px;background:var(--rubric-soft);font-size:.92rem}
.rite-step .t{font-weight:700;display:block}
.rite-step .nt{display:block;font-size:.9rem;color:var(--muted);margin-top:4px}
.cmp td:first-child{font-weight:700;white-space:nowrap}
.cmp td.no{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.check{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer}
.check input{margin-top:4px;accent-color:var(--rubric);width:18px;height:18px;flex:0 0 auto}
.check label.on span{color:var(--muted);text-decoration:line-through}
.today{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.today .btn{margin-left:auto}
.mlist{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
.mlist li::marker{color:var(--rubric);font-family:var(--f-display);font-weight:800}
.prayer{font-size:1.08rem;line-height:1.6;margin:8px 0 0;max-width:60ch}
.prayer .who{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rosary{max-width:300px;margin:0 auto}
.rosary .bd{fill:var(--card);stroke:var(--muted);stroke-width:1.5;transition:fill .2s}
.rosary .bd.big{fill:var(--gold);stroke:var(--ink)}
.rosary .bd.done{fill:var(--rubric-soft);stroke:var(--rubric)}
.rosary .bd.cur{fill:var(--rubric);stroke:var(--ink);stroke-width:2}
.rosary g.cur .bd{fill:var(--rubric)}.rosary circle.bd.cur{r:7px;stroke-width:3}.rosary g.done .bd{fill:var(--rubric-soft);stroke:var(--rubric)}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:.88rem;color:var(--muted)}
.subtab[aria-pressed="true"]{background:var(--rubric);border-color:var(--rubric);color:#fff}
.dev{padding:6px 18px 16px;border-top:1px solid var(--line)}
.dev p{margin:10px 0 0;max-width:64ch;line-height:1.6}
.dev .vr{color:var(--rubric)}
.brand-n{display:flex;flex-direction:column;line-height:1.15}
.brand-n small{font-size:.76rem;color:var(--muted);letter-spacing:.02em}
.parish{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px;align-items:start;margin:0 0 28px;padding-bottom:28px;border-bottom:1px solid var(--line)}
@media (max-width:640px){.parish{grid-template-columns:minmax(0,1fr)}.parish figure{max-width:340px}}
.parish figure{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:3/4;max-width:100%}
.parish img{width:100%;height:100%;object-fit:cover;display:block}
.parish h2{font-size:clamp(1.5rem,4vw,2rem);margin-top:4px}
.parish-t p{max-width:62ch;margin:0 0 10px}
.feasts,.turnos{display:flex;flex-direction:column;gap:10px}
.feast,.turno{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.turno{grid-template-columns:56px minmax(0,1fr) auto}
@media (max-width:560px){.turno{grid-template-columns:56px minmax(0,1fr)}.turno .tactions{grid-column:2}}
.feast.next{border-color:var(--rubric)}
.feast.patron{background:var(--rubric-soft);border-color:var(--rubric)}
.turno.mine{border-color:var(--ok)}
.fd{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:var(--paper);padding:6px 0;font-variant-numeric:tabular-nums}
.fd b{font-family:var(--f-display);font-size:1.6rem;line-height:1}

.jgmodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}.jgmode{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;color:var(--ink)}.jgmode.on{border-color:var(--rubric)}.jgmode b{display:block}.jgmode span{font-size:.85rem;color:var(--muted)}
.jgwho{font-size:1.1rem;margin:10px 0}.jgsel{margin:10px 0}.jgsel .chip.on{background:var(--c,var(--rubric));border-color:var(--c,var(--rubric));color:#fff}
.jgcard{--c:#7d1d24;background:var(--c);color:#fff;border-radius:22px;min-height:300px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 14px 30px rgba(0,0,0,.18);margin-top:12px;animation:jgin .35s ease}.jgcard p{font-size:1.45rem;line-height:1.35;font-weight:600;margin:auto 0;text-align:center;font-family:"Cormorant Garamond",Georgia,serif}.jgcard small{opacity:.7;text-align:center;font-size:.75rem;letter-spacing:.06em}
.jgcard.empty{background:var(--card);color:var(--muted);border:2px dashed var(--line);box-shadow:none}.jgcard.rolling{background:var(--card);align-items:center;justify-content:center;box-shadow:none;border:1px solid var(--line)}
.jgtop{display:flex;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}
.jglv{display:inline-flex;gap:3px;vertical-align:middle}.jglv i{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;opacity:.9}.jglv i.on{background:currentColor}
.jgbib{align-self:center;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:8px 14px;font-weight:600}
.jgdie{width:150px;height:150px;border-radius:26px;display:grid;place-items:center;text-align:center;color:#fff;font-weight:700;padding:10px;background:#7d1d24;font-size:1.05rem;animation:jgroll .3s linear infinite}
@keyframes jgroll{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.05)}100%{transform:rotate(-8deg)}}@keyframes jgin{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.gsteps{list-style:none;counter-reset:g;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:10px}.gsteps li{counter-increment:g;display:grid;grid-template-columns:34px 1fr;gap:4px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.gsteps li::before{content:counter(g);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--rubric,#7d1d24);color:#fff;display:grid;place-items:center;font-weight:700}.gsteps b{font-size:1.02rem}.gsteps span{color:var(--ink)}
.santo{display:flex;gap:10px;align-items:center;background:var(--card,#fff);border:1px solid var(--line,#e8dccb);border-radius:14px;padding:10px 14px;margin:-4px 0 14px}.santo i{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.08)}.santo span{line-height:1.3}.santo small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted,#8a7a72);font-weight:700}
@media (prefers-reduced-motion:reduce){#meMark,#prMark{transition:none}}

/* Examen */
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:12px 0 22px}
.prog i{display:block;height:100%;background:var(--rubric);transition:width .3s}
.cert{border:2px solid var(--gold);border-radius:14px;padding:28px 22px;text-align:center;background:var(--card);position:relative}
.cert::before{content:"";position:absolute;inset:6px;border:1px solid var(--gold);border-radius:10px;pointer-events:none;opacity:.6}
.cert h2{font-size:clamp(1.6rem,5vw,2.2rem);margin:8px 0}
.cert .score{font-family:var(--f-display);font-size:3.2rem;font-weight:800;color:var(--rubric);line-height:1;font-variant-numeric:tabular-nums}
input[type=text]{font:inherit;padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%;max-width:320px}
.foot{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);max-width:70ch}

{ t:"Teología de la Eucaristía", s:"Presencia real, sacrificio y banquete",
  lead:"La Eucaristía es Jesucristo mismo, realmente presente con su Cuerpo, Sangre, Alma y Divinidad bajo las apariencias de pan y vino. Todo lo que hace un ministro nace de creer esto.",
  verse:["Yo soy el pan vivo bajado del cielo. El que coma de este pan vivirá para siempre.","Juan 6, 51"],

    {h:"Para comulgar dignamente", li:["Estar en gracia de Dios; con pecado grave, confesarse antes (CIC c. 916).","Ayuno eucarístico de una hora, salvo agua y medicinas. No obliga a ancianos, enfermos ni a quienes los cuidan (c. 919)."]}
  ],

{ t:"Objetos, vestiduras y lugares", s:"Lo que hay en el presbiterio y la sacristía",

  secs:[
    {h:"Vasos sagrados", li:["<b>Cáliz:</b> copa donde se consagra el vino.","<b>Patena:</b> plato para la hostia grande.","<b>Copón (píxide):</b> vaso con tapa para las hostias de los fieles.","<b>Custodia:</b> para exponer el Santísimo.","<b>Teca:</b> cajita para llevar la Comunión a los enfermos."]},
    {h:"Lienzos y libros", li:["<b>Corporal:</b> lienzo blanco bajo el cáliz y el copón; recoge partículas.","<b>Purificador:</b> paño para limpiar el cáliz y los dedos.","<b>Palia:</b> cubre el cáliz. <b>Manutergio:</b> toalla del lavabo.","<b>Misal</b> (oraciones), <b>Leccionario</b> (lecturas), <b>Evangeliario</b> (Evangelios)."]},
    {h:"Lugares", li:["<b>Presbiterio</b> (zona del altar), <b>altar</b>, <b>ambón</b>, <b>sede</b>.","<b>Credencia:</b> mesita lateral para los vasos.","<b>Sagrario:</b> donde se reserva el Santísimo; la lámpara encendida indica su presencia.","<b>Sacrario:</b> lavabo que desemboca en la tierra, para el agua de purificación."]},
    {h:"Vestiduras y gestos", li:["Alba, cíngulo, estola, casulla (sacerdote) y dalmática (diácono). El MESC no usa estola.","<b>Genuflexión</b> ante el Santísimo; <b>inclinación profunda</b> ante el altar."]}
  ],
  key:"Si no sabes el nombre de algo en la sacristía, pregunta. Así se aprende el oficio.",
  quiz:[

    {q:"¿Qué es la teca?", o:["La cajita para llevar la Comunión a los enfermos","La copa del vino","La mesita lateral","El libro de lecturas"], why:"También se le llama portaviático."},

{ t:"Cómo dar la Comunión en la Misa", s:"Paso a paso y qué hacer si algo pasa",
  lead:"Dar la Comunión es sencillo, pero exige atención total: en cada hostia está Cristo entero.",
  rite:{h:"En la fila", steps:[

    {d:"Espera la respuesta antes de darla.", r:"Amén."},

    {d:"Para el cáliz:", s:"La Sangre de Cristo."}
  ]},
  secs:[
    {h:"Antes", li:["Llega 15 minutos antes y avisa al coordinador.","Manos y uñas limpias; sin perfume fuerte ni accesorios que estorben.","Participa en toda la Misa desde tu lugar."]},
    {h:"Durante", li:["Acércate cuando lo indique tu parroquia, con recogimiento.","Recibe la Comunión del sacerdote y luego el copón de sus manos. No lo tomas tú del altar ni del sagrario.","No agregues palabras a la fórmula, ni el nombre de la persona.","El fiel puede comulgar de pie o de rodillas, en la boca o en la mano (RS 90-92)."]},

  ],
  key:"Despacio, claro y con la mirada en la persona. La prisa es el error más común.",

    {q:"¿Cómo puede comulgar el fiel?", o:["De pie o de rodillas, en la boca o en la mano","Solo de pie","Solo de rodillas","Solo en la mano"], why:"RS 90-92. Nunca se niega la Comunión por la postura."}

  secs:[
    {h:"Antes de salir", li:["Ten la lista y avisa a la familia de tu visita.","Recibe las hostias como indique tu párroco y colócalas en la teca, dentro de su bolsa.","Ve directo: sin mandados ni paradas en el camino."]},
    {h:"Al llegar", li:["Pide una mesita con mantel blanco y, si se puede, una vela, un crucifijo y un vaso con agua."]}
  ],
  rite:{h:"Rito ordinario (esquema)", steps:[

/* ---------------- TIEMPO LITÚRGICO ---------------- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);const mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function season(d){
  const y=d.getFullYear(), D=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()), t=D(d), add=(x,n)=>new Date(x.getFullYear(),x.getMonth(),x.getDate()+n);
  const E=easter(y), ash=add(E,-46), hthu=add(E,-3), pent=add(E,49);
  const dec25=new Date(y,11,25), adv=add(dec25,-(dec25.getDay()||7)-21);
  const j6=new Date(y,0,6), bapt=add(j6,7-j6.getDay()||7);
  if(t>=adv && t<dec25) return ["Adviento","morado"];
  if(t>=dec25 || t<=bapt) return ["Navidad","blanco"];
  if(t>=ash && t<hthu) return ["Cuaresma","morado"];
  if(t>=hthu && t<E) return ["Triduo Pascual","rojo"];
  if(t>=E && t<pent) return ["Pascua","blanco"];
  if(+t===+pent) return ["Pentecostés","rojo"];
  return ["Tiempo Ordinario","verde"];
}

function vModulos(){
  if(modIdx!==null) return vLesson(modIdx);
  return `<div class="eyebrow">8 módulos</div><h1 style="font-size:2.2rem;margin:6px 0 8px">Módulos</h1>
  <p class="lead" style="margin-bottom:20px">Lee cada lección y contesta su quiz. El módulo queda completado con 3 de 4 aciertos.</p>
  <div class="mods">${MODS.map((m,i)=>{const sc=st.quiz[i];const pill=sc===undefined?`<span class="pill">Pendiente</span>`:(sc>=3?`<span class="pill done">✓ ${sc}/4</span>`:`<span class="pill try">${sc}/4 · repetir</span>`);
   return `<button class="mod" onclick="go('modulos',${i})"><span class="mod-n">${i+1}</span><span><span class="mod-t">${m.t}</span><br><span class="mod-s">${m.s}</span></span>${pill}</button>`;}).join("")}</div>`;
}

function rite(r){return `<div class="sec"><h2>${r.h}</h2><p class="legend"><span class="rubric">En rojo, lo que haces.</span> En negrita, lo que dices. R/. es la respuesta.</p><div class="rite">${r.steps.map((s,i)=>`<div class="rite-step"><span class="k">${i+1}</span><div><span class="rubric">${s.d}</span>${s.s?`<span class="say">${s.s}</span>`:""}${s.r?`<span class="resp">${s.r}</span>`:""}</div></div>`).join("")}</div></div>`;}
function secs(a){return (a||[]).map(s=>`<div class="sec"><h2>${s.h}</h2><ul>${s.li.map(l=>`<li>${l}</li>`).join("")}</ul></div>`).join("");}

let qstate={};
function vLesson(i){
  const m=MODS[i];
  if(!qstate[i]) qstate[i]={order:m.quiz.map(q=>shuffle(q.o.map((t,k)=>({t,k})))), ans:{}};
  const qs=qstate[i];
  let body="";
  if(m.verse) body+=`<p class="verse">“${m.verse[0]}”<cite>${m.verse[1]}</cite></p>`;
  if(m.table) body+=`<div class="sec"><h2>Los tiempos del año</h2><div class="tbl"><table><thead><tr><th>Tiempo</th><th>Cuándo</th><th>Color</th></tr></thead><tbody>${SEASONS_TABLE.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td><span class="sw" style="background:var(--lc-${r[2]})"></span>${r[3]}</td></tr>`).join("")}</tbody></table></div></div>`;
  if(m.rite && i===5) body+=rite(m.rite);
  body+=secs(m.secs);
  if(m.rite && i!==5) body+=rite(m.rite);
  body+=secs(m.secs2);
  body+=`<div class="keybox"><b>Para recordar</b>${m.key}</div>`;
  const answered=Object.keys(qs.ans).length;
  const score=Object.entries(qs.ans).filter(([q,k])=>k===0).length;
  const quiz=m.quiz.map((q,qi)=>{
    const a=qs.ans[qi];
    return `<div class="q"><p>${qi+1}. ${q.q}</p><div class="opts">${qs.order[qi].map(o=>{
      let cls="";if(a!==undefined){if(o.k===0)cls="right";else if(o.k===a)cls="wrong";}

function msUpdate(prev){
  const s=MSTEPS[ms.i]; ms.seen.add(ms.i);
  $("#msScene").innerHTML=svgw(SCENES[ms.i]());
  let t=`<div class="phase">${s.ph}</div><div class="ms-title">${s.t}</div><div class="ms-do">${s.do}</div>`;
  if(s.say) t+=`<div class="ms-say"><span class="who">${s.who}</span><strong>${s.say}</strong><span class="resp">${s.resp}</span></div>`;
  if(s.minis) t+=`<div class="minis"><div class="mini">${MINI_MANO}En la mano: sobre la palma que está arriba. La persona comulga frente a ti.</div><div class="mini">${MINI_BOCA}En la boca: sobre la lengua, sin tocarla con los dedos.</div></div>`;
  if(s.note) t+=`<div class="ms-note">${s.note}</div>`;
  if(s.tip) t+=`<div class="ms-tip">${s.tip}</div>`;
  $("#msText").innerHTML=t;
  $("#msCount").textContent=`${ms.i+1} de ${MSTEPS.length}`;
  $("#msPrev").disabled=ms.i===0; $("#msPrev").style.opacity=ms.i===0?.4:1;
  $("#msNext").textContent=ms.i===MSTEPS.length-1?"Volver al inicio":"Siguiente →";
  $("#meMark").style.transform=`translate(${s.me[0]}px,${s.me[1]}px)`;
  $("#prMark").style.transform=`translate(${s.pr[0]}px,${s.pr[1]}px)`;
  ["capilla","sac","pew","amb","altar","foot","aisle","cred","door"].forEach(h=>{const e=document.getElementById("hl-"+h);if(e)e.setAttribute("visibility",h===s.hl?"visible":"hidden");});
  $("#queue").setAttribute("visibility",s.queue?"visible":"hidden");
  const mp=$("#mpath");
  if(prev!==undefined&&s.path){const a=MSTEPS[prev].me;mp.setAttribute("x1",a[0]);mp.setAttribute("y1",a[1]);mp.setAttribute("x2",s.me[0]);mp.setAttribute("y2",s.me[1]);mp.setAttribute("visibility","visible");}
  else mp.setAttribute("visibility","hidden");
  document.querySelectorAll(".st-chip").forEach(c=>{const i=+c.dataset.i;c.setAttribute("aria-current",i===ms.i);c.classList.toggle("seen",ms.seen.has(i)&&i!==ms.i);});
  const cur=document.querySelector('.st-chip[aria-current="true"]'); if(cur){const st=$("#stStrip");st.scrollTo({left:cur.offsetLeft-st.offsetWidth/2+cur.offsetWidth/2,behavior:"smooth"});}
}
function msGo(i){const p=ms.i;ms.i=i;msUpdate(p);}
function msBind(){
  document.querySelectorAll(".st-chip").forEach(c=>c.onclick=()=>msGo(+c.dataset.i));
  $("#msPrev").onclick=()=>{if(ms.i>0)msGo(ms.i-1);};
  $("#msNext").onclick=()=>{msGo(ms.i<MSTEPS.length-1?ms.i+1:0);};
  msUpdate();
}

function vPalabra(){
  let n=0;
  const parts=CP_PARTS.map((p,pi)=>`<details class="part" id="cp${pi}" open><summary><b>${pi+1}</b><span>${p.n}</span><em>${p.opt?"Solo con mandato":p.steps.length+" pasos"}</em></summary>

  const bag=(st.bag||[]);
  const answered=Object.keys(cpq.ans).length, score=Object.values(cpq.ans).filter(a=>a===0).length;
  return `<section class="cp-hero"><div><div class="eyebrow">Para las comunidades donde no llega el sacerdote</div>

    <p class="lead">En las rancherías y capillas de la sierra, cuando el padre no puede llegar el domingo, la comunidad no se queda sin reunirse: escucha la Palabra de Dios y, si hay mandato, recibe la Comunión. Esta guía te lleva paso a paso.</p></div>
    <div class="pic">${cpScene()}</div></section>
  ${palabraDomingo()}
  <div class="facts">
    <div class="fact"><b>Con mandato</b><span>Solo se dirige con el encargo de tu párroco y según el ritual de tu diócesis.</span></div>
    <div class="fact"><b>No es una Misa</b><span>No hay consagración. Que la gente entienda la diferencia y siga deseando la Eucaristía.</span></div>
    <div class="fact"><b>Unida a la parroquia</b><span>La comunidad celebra en comunión con su párroco y con la Misa de la parroquia.</span></div>
    <div class="fact"><b>Vale la pena</b><span>Cuando no hay Misa, la Iglesia recomienda vivamente participar en la liturgia de la Palabra (CIC c. 1248 §2).</span></div>
  </div>

  <div class="warn" style="background:var(--card);border:1px solid var(--line);margin-top:18px">Para preparar las lecturas, abre <a href="#calendario" onclick="event.preventDefault();go('calendario')" style="color:var(--rubric);font-weight:700">Fechas y lecturas</a>: ahí está el enlace a las lecturas del próximo domingo.</div>
  <div class="sec"><h2>La celebración de un vistazo</h2>
   <div class="flow">${CP_PARTS.map((p,i)=>`<a href="#cp${i}" class="${p.opt?"opt-part":""}" onclick="event.preventDefault();document.getElementById('cp${i}').scrollIntoView({behavior:'smooth'})"><b>${i+1}</b>${p.n}${p.opt?" (si hay mandato)":""}</a>`).join("")}</div>
   <p class="legend" style="margin-top:10px"><span class="rubric">En rojo, lo que haces.</span> En negrita, lo que dices. R/. es la respuesta de la comunidad.</p>
  </div>

  <div class="sec"><h2>Lo que cambia cuando no hay sacerdote</h2>
   <div class="tbl"><table class="cmp"><thead><tr><th>Momento</th><th>El sacerdote en Misa</th><th>Tú, ministro laico</th></tr></thead><tbody>
   ${CP_CMP.map(r=>`<tr><td>${r[0]}</td><td class="no">${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div></div>

  <div class="sec"><h2>La maleta del misionero</h2><p class="muted" style="margin:0">Revísala antes de subir a la sierra. Tus marcas se guardan en este dispositivo.</p>
   <div class="check">${CP_BAG.map((b,i)=>`<label class="${bag.includes(i)?"on":""}"><input type="checkbox" id="bag${i}" ${bag.includes(i)?"checked":""} onchange="toggleBag(${i},this)"><span>${b}</span></label>`).join("")}</div>
   <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="st.bag=[];save();render()">Desmarcar todo</button></div></div>

  <div class="sec"><h2>En el camino y después</h2><ul>
   <li>Si llevas la Comunión, ve directo y con recogimiento. La teca va en su bolsa, cerca del pecho; nunca se deja sola en el carro.</li>
   <li>Llega con tiempo para preparar el lugar: mantel, cruz, velas, ambón o una mesita para las lecturas.</li>
   <li>Reparte las tareas: lectores, salmista, quien anime el canto y quien recoja la colecta.</li>
   <li>Al terminar, informa a tu párroco: cuántos asistieron, enfermos que piden visita, niños por bautizar, matrimonios o confesiones pendientes.</li>
   <li>Las hostias que sobren regresan al sagrario ese mismo día.</li></ul>
   <div class="keybox"><b>Para recordar</b>Eres un servidor que reúne a la comunidad en nombre de la Iglesia. Tu sencillez ayuda a que la gente desee aún más la Misa cuando llegue el sacerdote.</div></div>

  <section class="quiz"><div class="eyebrow">Comprueba lo aprendido</div><h2>Quiz de la Celebración de la Palabra</h2>
   ${CP_QUIZ.map((q,qi)=>{const a=cpq.ans[qi];return `<div class="q"><p>${qi+1}. ${q.q}</p><div class="opts">${cpq.order[qi].map(o=>{let c="";if(a!==undefined){if(o.k===0)c="right";else if(o.k===a)c="wrong";}return `<button class="opt ${c}" ${a!==undefined?"disabled":""} onclick="cpAns(${qi},${o.k})">${o.t}</button>`;}).join("")}</div>${a!==undefined?`<div class="why"><strong>${a===0?"¡Correcto!":"La respuesta es: "+q.o[0]+"."}</strong> ${q.why}</div>`:""}</div>`;}).join("")}
   ${answered===CP_QUIZ.length?`<div class="result"><div><h3>${score>=5?"¡Listo para la misión!":"Repasa un poco más"}</h3><span class="muted">${score} de ${CP_QUIZ.length} aciertos</span></div><button class="btn ghost" onclick="cpq={order:CP_QUIZ.map(q=>shuffle(q.o.map((t,k)=>({t,k})))),ans:{}};render()">Repetir quiz</button></div>`:""}
  </section>
  <p class="foot">Esta guía sigue el Directorio para las celebraciones dominicales en ausencia de presbítero (1988). Las fórmulas exactas pueden variar: usa siempre el ritual o subsidio que indique tu diócesis y tu párroco.</p>`;
}
function toggleBag(i,el){st.bag=st.bag||[];if(el.checked){if(!st.bag.includes(i))st.bag.push(i);}else st.bag=st.bag.filter(x=>x!==i);save();el.parentElement.classList.toggle("on",el.checked);}
function cpAns(qi,k){if(cpq.ans[qi]!==undefined)return;cpq.ans[qi]=k;if(Object.keys(cpq.ans).length===CP_QUIZ.length){st.cp=Math.max(st.cp||0,Object.values(cpq.ans).filter(a=>a===0).length);save();}const y=window.scrollY;render();window.scrollTo(0,y);}

const monstrance=(x,y,s)=>{s=s||1;let r="";for(let a=0;a<16;a++){const t=a*Math.PI/8,x1=x+Math.cos(t)*15*s,y1=y+Math.sin(t)*15*s,x2=x+Math.cos(t)*(a%2?24:29)*s,y2=y+Math.sin(t)*(a%2?24:29)*s;r+=`<line class="ray" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;}
 return r+`<circle class="gd" cx="${x}" cy="${y}" r="${14*s}"/>${host(x,y,10*s)}<line class="l" x1="${x}" y1="${y-29*s}" x2="${x}" y2="${y-38*s}"/><line class="l" x1="${x-4*s}" y1="${y-34*s}" x2="${x+4*s}" y2="${y-34*s}"/><rect class="gd" x="${x-3*s}" y="${y+14*s}" width="${6*s}" height="${22*s}"/><circle class="gd" cx="${x}" cy="${y+24*s}" r="${4*s}"/><path class="gd" d="M${x-14*s} ${y+44*s} Q${x} ${y+32*s} ${x+14*s} ${y+44*s} Z"/>`;};
const candle=(x,b,h)=>`<rect class="obj" x="${x-3}" y="${b-h}" width="6" height="${h}" rx="1"/><path class="flame" d="M${x} ${b-h-11} Q${x+5} ${b-h-5} ${x} ${b-h-1} Q${x-5} ${b-h-5} ${x} ${b-h-11} Z"/>`;

const RG=(()=>{const cx=150,cy=118,r=100,pos={};
 pos.medal=[cx,cy+r];
 const loop=[];for(let d=0;d<5;d++){for(let a=0;a<10;a++)loop.push("s"+d+"_"+a);if(d<4)loop.push("L"+(d+1));}
 loop.forEach((id,i)=>{const t=Math.PI/2+(i+1)*2*Math.PI/(loop.length+1);pos[id]=[cx+Math.cos(t)*r,cy+Math.sin(t)*r];});
 pos.L0=[cx,cy+r+28];["p0","p1","p2"].forEach((id,i)=>pos[id]=[cx,cy+r+48+i*16]);pos.P0=[cx,cy+r+100];pos.cross=[cx,cy+r+138];
 return pos;})();

 S.push({b:"L0",p:"gloria",h:"Antes de la medalla"});
 for(let d=0;d<5;d++){
  const big=d===0?"medal":"L"+d;
  S.push({b:big,p:"pn",h:`${ORD[d]} misterio ${M.n.toLowerCase().replace(/s$/,"")}`,ann:d});

 }

}

const RV={on:false,paused:false,mode:"todo",rate:0.9,timer:null,lock:null,gen:0,ok:("speechSynthesis" in window)&&typeof SpeechSynthesisUtterance!=="undefined"};
try{const v=JSON.parse(localStorage.getItem("escuela-voz")||"{}");if(v.mode)RV.mode=v.mode;if(v.rate)RV.rate=v.rate;}catch(e){}

function rvVoice(){let vs=[];try{vs=speechSynthesis.getVoices();}catch(e){}
 return vs.find(v=>/^es[-_]MX/i.test(v.lang))||vs.find(v=>/^es[-_](US|419)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;}
const rvClean=t=>String(t).replace(/<[^>]+>/g,"").replace(/\([^)]*\)/g,"").replace(/\s+/g," ").trim();
function rvParts(s){const p=PR[s.p],M=MYST[ro.key],out=[];
 if(s.p==="let"){const L=litRos();if(!L)return [{t:"Letanías"}];out.push({t:L.t+"."});
  L.lit.forEach(([r,inv])=>inv.forEach(i=>{out.push({t:i+"."});out.push({t:(r==="Se repite lo mismo"?i:r)+".",resp:true});}));
  (L.end||[]).forEach(([k,t])=>out.push({t,resp:k==="R/."}));return out;}
 if(s.ann!==undefined){const m=M.m[s.ann];out.push({t:ORD[s.ann]+" misterio: "+m[0]+"."});}
 if(s.x) out.push({t:s.x});
 out.push({t:p.g}); if(p.a&&rvClean(p.a)) out.push({t:p.a,resp:true});
 if(s.then){const q=PR[s.then];out.push({t:q.g});if(q.a&&rvClean(q.a))out.push({t:q.a,resp:true});}
 return out;}
function rvSay(text,cb,g){
 // frases cortas: algunos celulares cortan textos largos
 const chunks=[];rvClean(text).split(/(?<=[.;:!?])\s+/).filter(Boolean).forEach(f=>{if(f.length<=160){chunks.push(f);return;}let cur="";f.split(/(?<=,)\s+/).forEach(p=>{if((cur+" "+p).length>160&&cur){chunks.push(cur);cur=p;}else cur=cur?cur+" "+p:p;});if(cur)chunks.push(cur);});let i=0;
 const one=()=>{if(g!==RV.gen)return;if(i>=chunks.length){cb();return;}
  const u=new SpeechSynthesisUtterance(chunks[i++]);const v=rvVoice();if(v)u.voice=v;u.lang=v?v.lang:"es-MX";u.rate=RV.rate;
  u.onend=()=>{if(g===RV.gen)one();};u.onerror=()=>{if(g===RV.gen)one();};speechSynthesis.speak(u);};
 one();}
function rvStep(){
 if(!RV.on||RV.paused)return;const g=++RV.gen;const S=roSteps(ro.key);const parts=rvParts(S[ro.i]);let k=0;
 const next=()=>{if(g!==RV.gen||!RV.on||RV.paused)return;
  if(k>=parts.length){if(ro.i<S.length-1){ro.i++;roUpdate();RV.timer=setTimeout(()=>{if(g===RV.gen)rvStep();},600);}else rvStop(true);return;}
  const part=parts[k++];
  if(part.resp&&RV.mode==="yo"){rvHint(true);const w=rvClean(part.t).split(" ").length;RV.timer=setTimeout(()=>{rvHint(false);next();},Math.max(2500,w*520/RV.rate));return;}
  rvSay(part.t,()=>{RV.timer=setTimeout(next,250);},g);};
 next();}

function miniQuiz(Q,stateName,title){
 const S=window[stateName]; return `<section class="quiz"><div class="eyebrow">Comprueba lo aprendido</div><h2>${title}</h2>
 ${Q.map((q,qi)=>{const a=S.ans[qi];return `<div class="q"><p>${qi+1}. ${q.q}</p><div class="opts">${S.order[qi].map(o=>{let c="";if(a!==undefined){if(o.k===0)c="right";else if(o.k===a)c="wrong";}return `<button class="opt ${c}" ${a!==undefined?"disabled":""} onclick="mqAns('${stateName}',${qi},${o.k})">${o.t}</button>`;}).join("")}</div>${a!==undefined?`<div class="why"><strong>${a===0?"¡Correcto!":"La respuesta es: "+q.o[0]+"."}</strong> ${q.why}</div>`:""}</div>`;}).join("")}
 ${Object.keys(S.ans).length===Q.length?`<div class="result"><div><h3>${Object.values(S.ans).filter(a=>a===0).length>=Q.length-1?"¡Muy bien!":"Repasa un poco más"}</h3><span class="muted">${Object.values(S.ans).filter(a=>a===0).length} de ${Q.length} aciertos</span></div><button class="btn ghost" onclick="mqReset('${stateName}')">Repetir quiz</button></div>`:""}</section>`;}
const mqNew=Q=>({Q,order:Q.map(q=>shuffle(q.o.map((t,k)=>({t,k})))),ans:{}});
function mqAns(n,qi,k){const S=window[n];if(S.ans[qi]!==undefined)return;S.ans[qi]=k;const y=window.scrollY;render();window.scrollTo(0,y);}
function mqReset(n){window[n]=mqNew(window[n].Q);const y=window.scrollY;render();window.scrollTo(0,y);}

function enUpdate(){

 $("#enScene").innerHTML=svgw(s.sc());
 let t=`<div class="phase">${s.ph}</div><div class="ms-title">${s.t}</div><div class="ms-do">${s.do}</div>`;
 if(s.say)t+=`<div class="ms-say"><span class="who">${s.who}</span><strong>${s.say}</strong>${s.resp?`<span class="resp">${s.resp}</span>`:""}</div>`;
 if(s.note)t+=`<div class="ms-note">${s.note}</div>`;if(s.tip)t+=`<div class="ms-tip">${s.tip}</div>`;
 $("#enText").innerHTML=t;$("#enCount").textContent=`${en.i+1} de ${ENF.length}`;
 $("#enPrev").disabled=en.i===0;$("#enPrev").style.opacity=en.i===0?.4:1;$("#enNext").textContent=en.i===ENF.length-1?"Volver al inicio":"Siguiente →";
 document.querySelectorAll("#enStrip .st-chip").forEach(c=>{const i=+c.dataset.i;c.setAttribute("aria-current",i===en.i);c.classList.toggle("seen",en.seen.has(i)&&i!==en.i);});

}

async function rpc(fn,args){
 const r=await fetch(CFG.supabaseUrl.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":CFG.supabaseKey,"Authorization":"Bearer "+CFG.supabaseKey,"Content-Type":"application/json"},body:JSON.stringify(args||{})});

 if(!r.ok){const e=new Error((j&&j.message)||"No se pudo conectar");e.status=r.status;throw e;}
 return j;
}
const SYNC_KEYS=["quiz","known","scen","order","exam","cp","ex","act","fav"];
function mergeAvance(a,b){
 b=b||{};const o={};const uni=(x,y)=>Array.from(new Set([...(x||[]),...(y||[])]));
 o.quiz=Object.assign({},b.quiz||{});Object.entries(a.quiz||{}).forEach(([k,v])=>{o.quiz[k]=Math.max(v,o.quiz[k]||0);});
 o.known=uni(a.known,b.known);
 o.scen=Object.assign({},b.scen||{},a.scen||{});o.order=Object.assign({},b.order||{},a.order||{});
 o.exam={best:Math.max((a.exam||{}).best||0,(b.exam||{}).best||0),name:(a.exam&&a.exam.name)||(b.exam&&b.exam.name)||""};
 o.cp=Math.max(a.cp||0,b.cp||0);o.ex=Math.max(a.ex||0,b.ex||0);o.act=Object.assign({},b.act||{});Object.entries(a.act||{}).forEach(([d,v])=>{const t=Object.assign({},o.act[d]||{});Object.entries(v).forEach(([k,n])=>{t[k]=Math.max(n,t[k]||0);});o.act[d]=t;});o.fav=uni(a.fav,b.fav);
 return o;
}

const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);

function yearFeasts(y){
 const E=easter(y), F=[];
 const ep=(()=>{for(let d=2;d<=8;d++){const x=new Date(y,0,d);if(x.getDay()===0)return x;}})();
 const bapt=ep.getDate()>=7?addD(ep,1):addD(ep,7);
 F.push({d:new Date(y,0,1),n:"Santa María, Madre de Dios",c:"blanco",p:"Solemnidad y Jornada Mundial por la Paz. Es día de precepto."});

 F.push({d:bapt,n:"Bautismo del Señor",c:"blanco",p:"Termina el tiempo de Navidad. Al día siguiente empieza el Tiempo Ordinario."});
 F.push({d:new Date(y,1,2),n:"Presentación del Señor (Candelaria)",c:"blanco",p:"Bendición de las candelas y presentación de los Niños Dios. Ayuda a organizar la fila de las familias."});
 F.push({d:addD(E,-46),n:"Miércoles de Ceniza",c:"morado",p:"Inicia la Cuaresma. Llega mucha gente; si el padre lo pide, los ministros ayudan a imponer la ceniza. Ayuno y abstinencia."});
 F.push({d:addD(E,-7),n:"Domingo de Ramos",c:"rojo",p:"Bendición de ramos y procesión. Se lee la Pasión: Misa más larga."});
 F.push({d:addD(E,-3),n:"Jueves Santo",c:"blanco",p:"Misa de la Cena del Señor y lavatorio de pies. El Santísimo se traslada al monumento y hay adoración hasta la noche. Organicen turnos."});
 F.push({d:addD(E,-2),n:"Viernes Santo",c:"rojo",p:"No hay Misa. En la celebración de la Pasión se comulga con las hostias consagradas el Jueves. Viacrucis. Ayuno y abstinencia."});
 F.push({d:addD(E,-1),n:"Vigilia Pascual",c:"blanco",p:"La celebración más importante del año, en la noche del sábado. Bautismos y fuego nuevo."});

 F.push({d:addD(E,42),n:"Ascensión del Señor",c:"blanco",p:"En México se celebra en domingo."});
 F.push({d:addD(E,49),n:"Pentecostés",c:"rojo",p:"Termina el tiempo de Pascua. Fiesta del Espíritu Santo."});
 F.push({d:addD(E,56),n:"Santísima Trinidad",c:"blanco",p:"Primer domingo después de Pentecostés."});
 F.push({d:addD(E,60),n:"Corpus Christi",c:"blanco",p:"Fiesta del Cuerpo y la Sangre de Cristo, con procesión del Santísimo. Algunas diócesis la trasladan al domingo: confirma la fecha con el padre."});
 F.push({d:addD(E,68),n:"Sagrado Corazón de Jesús · Fiesta patronal",c:"blanco",p:"La fiesta de nuestra parroquia. Habrá más Misas, procesión y mucha gente: organicen con tiempo el rol de ministros.",patron:true});
 F.push({d:new Date(y,7,15),n:"Asunción de la Virgen María",c:"blanco",p:"Solemnidad de María llevada al cielo."});
 F.push({d:new Date(y,10,1),n:"Todos los Santos",c:"blanco",p:"Solemnidad. Es día de precepto."});
 F.push({d:new Date(y,10,2),n:"Fieles Difuntos",c:"morado",p:"Misas, rezos y visitas al panteón. Prepárate para guiar rezos por los difuntos."});
 F.push({d:addD(adventStart(y),-7),n:"Jesucristo, Rey del Universo",c:"blanco",p:"Último domingo del año litúrgico."});
 F.push({d:adventStart(y),n:"Primer domingo de Adviento",c:"morado",p:"Empieza el año litúrgico y cambia el ciclo de lecturas. Se enciende la primera vela de la corona."});
 F.push({d:new Date(y,11,8),n:"Inmaculada Concepción",c:"blanco",p:"Solemnidad de María concebida sin pecado. Es día de precepto."});

 F.push({d:new Date(y,11,25),n:"Natividad del Señor",c:"blanco",p:"Misa de Nochebuena y de Navidad. Mucha gente: revisen el rol con tiempo."});
 return F;
}
function upcomingFeasts(n){const t=dOnly(new Date()),y=t.getFullYear();return [...yearFeasts(y),...yearFeasts(y+1)].filter(f=>f.d>=t).sort((a,b)=>a.d-b.d).slice(0,n);}
function litYear(d){const y=d.getFullYear(),E=d>=adventStart(y)?y+1:y;return {dom:["C","A","B"][E%3],fer:E%2?"I":"II",E};}
function nextSunday(){const t=dOnly(new Date());return addD(t,(7-t.getDay())%7);}

function bibRef(q){
 const m=bibNorm(q).trim().match(/^([123]?\s?[a-z]+)\.?\s*(\d+)(?:\s*[,:]\s*(\d+))?$/);if(!m)return null;
 const t=m[1].replace(/\s/g,"");
 const bk=BIB_IDX.find(b=>bibNorm(b[2]).replace(/\s/g,"")===t)||BIB_IDX.find(b=>bibNorm(b[1]).replace(/\s/g,"").startsWith(t));
 if(!bk)return null;const c=+m[2];if(c<1||c>bk[3])return null;return {b:bk[0],c,v:m[3]?+m[3]:null};}
async function bibSearch(){

 const nq=bibNorm(q),out=[];
 try{for(let i=0;i<BIB_IDX.length;i++){const id=BIB_IDX[i][0];const bk=await bibLoad(id);BIB.prog=Math.round((i+1)/BIB_IDX.length*100);const pe=document.getElementById("bibProg");if(pe)pe.textContent=BIB.prog+"%";
  bk.c.forEach((ch,ci)=>ch.forEach(([v,t])=>{if(out.length<200&&bibNorm(t).includes(nq))out.push([id,ci+1,v,t]);}));if(out.length>=200)break;}
  BIB.res=out;}catch(e){BIB.err="Sin conexión: descarga la Biblia completa para buscar sin señal.";}
 BIB.busy=false;render();}

 BIB.dl=null;render();}

function calTurno(id){
 const t=(ROL.turnos||[]).find(x=>x.id===id);if(!t)return;
 const d=t.fecha.replace(/-/g,""),hm=(t.hora||"").replace(":","");
 const title=(t.tipo||"Turno")+" · Ministros Sagrado Corazón",loc=t.lugar||"Parroquia Sagrado Corazón de Jesús, El Cercado",det=(t.notas?t.notas+"\n":"")+"Rol de servicio de la Escuela de Ministros.";
 let st,en,allDay=!/^\d{4}$/.test(hm);
 if(!allDay){const h=+hm.slice(0,2),m=+hm.slice(2);const e=new Date(2000,0,1,h,m+90);st=d+"T"+hm+"00";en=d+"T"+String(e.getHours()).padStart(2,"0")+String(e.getMinutes()).padStart(2,"0")+"00";}
 else{const n=new Date(t.fecha+"T12:00:00");n.setDate(n.getDate()+1);st=d;en=n.toISOString().slice(0,10).replace(/-/g,"");}
 if(typeof isIOS==="function"&&isIOS()){
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Escuela de Ministros//ES","BEGIN:VEVENT","UID:"+id+"@escuela-ministros","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",allDay?"DTSTART;VALUE=DATE:"+st:"DTSTART:"+st,allDay?"DTEND;VALUE=DATE:"+en:"DTEND:"+en,"SUMMARY:"+title,"LOCATION:"+loc.replace(/,/g,"\\,"),"DESCRIPTION:"+det.replace(/\n/g,"\\n").replace(/,/g,"\\,"),"BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:"+title,"END:VALARM","BEGIN:VALARM","TRIGGER:-PT2H","ACTION:DISPLAY","DESCRIPTION:"+title,"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="turno-"+t.fecha+".ics";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);return;}
 window.open("https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&dates="+st+"/"+en+"&ctz=America/Mexico_City&location="+encodeURIComponent(loc)+"&details="+encodeURIComponent(det),"_blank","noopener");
}

(function(){st.act=st.act||{};const lim=dayKey(new Date(Date.now()-150*864e5));Object.keys(st.act).forEach(k=>{if(k<lim)delete st.act[k];});})();
function logAct(k,n){st.act=st.act||{};const d=dayKey();st.act[d]=st.act[d]||{};st.act[d][k]=(st.act[d][k]||0)+(n||1);save();}
function setAct(k,on){st.act=st.act||{};const d=dayKey();st.act[d]=st.act[d]||{};if(on)st.act[d][k]=1;else delete st.act[d][k];save();}
const actDay=d=>(st.act||{})[dayKey(d)]||{};
const hasAct=d=>Object.values(actDay(d)).some(v=>v>0);
function weekStart(d){const x=dOnly(d||new Date());const w=(x.getDay()+6)%7;return addD(x,-w);}
function weekTotals(ws){const t={};for(let i=0;i<7;i++){const a=actDay(addD(ws,i));Object.entries(a).forEach(([k,v])=>{t[k]=(t[k]||0)+v;});t._days=(t._days||0)+(Object.values(a).some(v=>v>0)?1:0);if(a.ros)t._rosDays=(t._rosDays||0)+1;}return t;}
function streak(){let n=0,d=dOnly(new Date());if(!hasAct(d))d=addD(d,-1);while(hasAct(d)){n++;d=addD(d,-1);}return n;}
function bestStreak(){const ks=Object.keys(st.act||{}).filter(k=>Object.values(st.act[k]).some(v=>v>0)).sort();let b=0,c=0,prev=null;ks.forEach(k=>{const d=new Date(k+"T12:00:00");c=(prev&&Math.round((d-prev)/864e5)===1)?c+1:1;b=Math.max(b,c);prev=d;});return b;}

}

function santoHoy(d){

 const f=[...yearFeasts(d.getFullYear())].find(x=>+dOnly(x.d)===+d);if(f)return {n:f.n,c:f.c,t:"Hoy celebramos"};
 const [sn,sc]=season(d);
 if(d.getDay()===0)return {n:"Domingo, día del Señor · "+sn,c:sc,t:"Hoy"};
 const s=SANTOS[pad2(d.getMonth()+1)+pad2(d.getDate())];
 const E=easter(d.getFullYear()),oct=d>=E&&d<=addD(E,7);
 if(oct)return {n:"Octava de Pascua",c:"blanco",t:"Hoy"};
 if(s&&sn!=="Triduo Pascual")return {n:s.n,c:s.c,t:"Santo del día"};

 lines.slice(0,5).forEach(l=>{g.fillText(l,W/2,y);y+=56;});
 // cuadritos
 const tl=[["ros","Rosarios"],["misa","Misas"],["ora","Oraciones"],["bib","Capítulos"],["exa","Exámenes"],["vis","Visitas"]];
 const top=y+Math.max(20,(H-170-y-280)/2);tl.forEach(([k,l],i)=>{const col=i%3,row=Math.floor(i/3),bw=280,bh=130,x=W/2-1.5*bw-20+col*(bw+20),yy=top+row*(bh+20);g.fillStyle="#f5ece0";g.beginPath();g.roundRect?g.roundRect(x,yy,bw,bh,20):g.rect(x,yy,bw,bh);g.fill();g.fillStyle=wine;g.font=`700 56px ${D}`;g.fillText(String(t[k]||0),x+bw/2,yy+68);g.fillStyle=mut;g.font=`400 24px ${B}`;g.fillText(l,x+bw/2,yy+108);});
 g.fillStyle=gold;g.font=`700 30px ${B}`;g.fillText(sk?`🕯 ${sk} ${sk===1?"día":"días"} de oración seguida`:"🕯 Esta semana enciendo mi vela",W/2,H-110);
 g.fillStyle=mut;g.font=`400 22px ${B}`;g.fillText("Escuela de Ministros · Sagrado Corazón de Jesús, El Cercado",W/2,H-60);

const VAPID_PUB="BJCKrk6uexkcYnkvhsSKf6rWwf_rZuGHuFwij6m4NbKj5etrXoF0gWjYrmQBJ8dr2c2KdnR9ZpyajAyTj9T7GsA";
const PU={st:null,busy:false,msg:""};
const pushOK=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
function b64u(s){const p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0));}
async function pushCheck(){
 if(!pushOK()){PU.st=isIOS()&&!isStandalone()?"instalar":"no";return;}
 if(Notification.permission==="denied"){PU.st="bloqueado";return;}
 try{const r=await navigator.serviceWorker.getRegistration();const s=r&&await r.pushManager.getSubscription();PU.st=s?"on":"off";}catch(e){PU.st="off";}
}
async function pushActivar(){
 if(!ME||!ME.id){go("entrar");return;}
 PU.busy=true;PU.msg="";render();
 try{
  const p=await Notification.requestPermission();if(p!=="granted"){PU.st=p==="denied"?"bloqueado":"off";throw new Error(p==="denied"?"":"No diste permiso. Inténtalo otra vez.");}
  const r=await navigator.serviceWorker.ready;let s=await r.pushManager.getSubscription();
  if(!s)s=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUB)});
  const j=s.toJSON();await rpc("push_guardar",{p_codigo:ME.codigo,p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
  PU.st="on";PU.msg="¡Listo! Te avisaremos aquí cuando te asignen un servicio o haya un aviso.";
 }catch(e){if(e&&e.status===404)PU.msg="Falta activar las notificaciones en Supabase (notificaciones.sql).";else if(e&&e.message)PU.msg=e.message;}
 PU.busy=false;render();
}
async function pushDesactivar(){
 PU.busy=true;render();
 try{const r=await navigator.serviceWorker.ready;const s=await r.pushManager.getSubscription();if(s){try{await rpc("push_quitar",{p_codigo:ME.codigo,p_endpoint:s.endpoint});}catch(e){}await s.unsubscribe();}PU.st="off";PU.msg="Notificaciones apagadas en este celular.";}catch(e){PU.msg=e.message||"";}
 PU.busy=false;render();
}
function pushCard(){
 if(!ME||!ME.id)return "";
 if(PU.st===null){pushCheck().then(()=>{if(PU.st!==null&&(view==="yo"||view==="inicio"))render();});return "";}
 const S=PU.st;let body="";
 if(S==="on")body=`<p class="muted" style="margin:0 0 10px">Están encendidas en este celular. Te sonará cuando te asignen un servicio o el padre publique un aviso.</p><button class="btn ghost" ${PU.busy?"disabled":""} onclick="pushDesactivar()">Apagar</button>`;
 else if(S==="off")body=`<p class="muted" style="margin:0 0 10px">Para que tu celular suene cuando te asignen un servicio o haya un aviso nuevo.</p><button class="btn red" ${PU.busy?"disabled":""} onclick="pushActivar()">${PU.busy?"Activando…":"Activar notificaciones"}</button>`;
 else if(S==="instalar")body=`<p style="margin:0">En iPhone primero instala la app: toca <b>Compartir</b> <span aria-hidden="true">⎋</span> y luego <b>Agregar a pantalla de inicio</b>. Ábrela desde ese ícono y aquí aparecerá el botón.</p>`;
 else if(S==="bloqueado")body=`<p style="margin:0">Las bloqueaste antes. Ve a la configuración del navegador → <b>Notificaciones</b> → permite este sitio, y vuelve aquí.</p>`;
 else body=`<p class="muted" style="margin:0">Este navegador no permite notificaciones. Prueba con Chrome (Android) o con la app instalada (iPhone).</p>`;
 return `<section class="ycard"><h2>🔔 Notificaciones</h2>${body}${PU.msg?`<p style="margin:10px 0 0">${esc(PU.msg)}</p>`:""}</section>`;
}
const inicioPush=()=>{if(!ME||!ME.id)return "";if(PU.st===null){pushCard();return "";}return PU.st==="off"||PU.st==="instalar"||PU.msg?pushCard():"";};
async function pushEnviar(d){
 try{const r=await fetch("/api/push",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({codigo:ME.codigo,...d})});const j=await r.json().catch(()=>({}));
  if(r.ok)return j.total?` Se avisó a ${j.enviadas} ${j.enviadas===1?"celular":"celulares"}.`:" (Nadie tiene las notificaciones activadas todavía.)";

}

/* 1) Fondo para rezar: música generada en el celular (sin internet, sin derechos de autor) */
const MU={on:false,style:"organo",vol:0.5,ctx:null,master:null,timer:null,step:0,tab:"fondo",q:"",list:null,playing:null,url:null,msg:""};
try{const m=JSON.parse(localStorage.getItem("escuela-musica")||"{}");if(m.style)MU.style=m.style;if(m.vol!=null)MU.vol=m.vol;}catch(e){}
const muSave=()=>{try{localStorage.setItem("escuela-musica",JSON.stringify({style:MU.style,vol:MU.vol}));}catch(e){}};
const MU_STY={organo:{n:"Órgano suave",d:"Acordes lentos, como en el templo"},coro:{n:"Coro celestial",d:"Voces suaves sin palabras"},arpa:{n:"Arpa y luz",d:"Notas delicadas para meditar"}};
// D – Bm – G – A – D – G – Em – A  (frecuencias MIDI)
const MU_PROG=[[50,62,66,69],[47,59,62,66],[43,59,62,67],[45,57,61,64],[50,62,66,69],[43,59,62,71],[40,55,59,64],[45,57,61,69]];
const mf=n=>440*Math.pow(2,(n-69)/12);
function muInit(){
 if(MU.ctx)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
 const ctx=new C(),master=ctx.createGain(),lp=ctx.createBiquadFilter(),rev=ctx.createConvolver(),wet=ctx.createGain(),dry=ctx.createGain();
 lp.type="lowpass";lp.frequency.value=2400;
 const len=ctx.sampleRate*3.5,ir=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
 rev.buffer=ir;wet.gain.value=0.55;dry.gain.value=0.6;
 master.connect(lp);lp.connect(dry);lp.connect(rev);rev.connect(wet);dry.connect(ctx.destination);wet.connect(ctx.destination);
 master.gain.value=0;MU.ctx=ctx;MU.master=master;
}
function muNote(f,t0,dur,type,vol,att,detune){
 const c=MU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;if(detune)o.detune.value=detune;
 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+att);g.gain.setValueAtTime(vol,t0+Math.max(att,dur-att));g.gain.linearRampToValueAtTime(0,t0+dur+att);
 o.connect(g);g.connect(MU.master);o.start(t0);o.stop(t0+dur+att+0.1);
}
function muChord(){
 const c=MU.ctx;if(!c||!MU.on)return;const t=c.currentTime+0.05,ch=MU_PROG[MU.step%MU_PROG.length],D=8;MU.step++;
 if(MU.style==="organo"){ch.forEach((n,i)=>{muNote(mf(n),t,D,"sine",i?0.05:0.07,2.5);muNote(mf(n)*2,t,D,"triangle",0.012,3);});muNote(mf(ch[0]-12),t,D,"sine",0.06,3);}
 else if(MU.style==="coro"){ch.forEach(n=>{[-7,7].forEach(dt=>muNote(mf(n+12),t,D,"sawtooth",0.008,3.2,dt));muNote(mf(n+12),t,D,"sine",0.03,3);});}
 else{ch.forEach((n,i)=>muNote(mf(n),t,D,"sine",0.025,3));const arp=[...ch.slice(1),ch[1]+12,ch[2]+12,ch[3]+12];for(let k=0;k<8;k++){const n=arp[(k*3+MU.step)%arp.length]+12;const tk=t+k*1;const o=c.createOscillator(),g=c.createGain();o.type="triangle";o.frequency.value=mf(n);g.gain.setValueAtTime(0,tk);g.gain.linearRampToValueAtTime(0.05,tk+0.01);g.gain.exponentialRampToValueAtTime(0.0008,tk+2.2);o.connect(g);g.connect(MU.master);o.start(tk);o.stop(tk+2.4);}}
}
function muStart(){
 muInit();if(!MU.ctx){MU.msg="Este celular no permite música generada.";render();return;}
 audStop();MU.ctx.resume&&MU.ctx.resume();MU.on=true;MU.step=0;const g=MU.master.gain,t=MU.ctx.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(MU.vol,t+2.5);
 muChord();clearInterval(MU.timer);MU.timer=setInterval(muChord,8000);muPill();
}
function muStop(){
 MU.on=false;clearInterval(MU.timer);if(MU.ctx){const g=MU.master.gain,t=MU.ctx.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(0,t+1.5);}muPill();
}
function muToggle(){MU.on?muStop():muStart();if(view==="musica")render();else muPill();}
function muVol(v){MU.vol=+v;muSave();if(MU.on&&MU.ctx){const g=MU.master.gain;g.cancelScheduledValues(MU.ctx.currentTime);g.setTargetAtTime(MU.vol,MU.ctx.currentTime,0.3);}}
function muStyle(s){MU.style=s;muSave();if(MU.on){MU.step=0;}render();}
function muPill(){
 let p=document.getElementById("mupill");if(!p){p=document.createElement("div");p.id="mupill";document.body.appendChild(p);}
 const on=MU.on||(MU.playing&&AUD.el&&!AUD.el.paused);p.hidden=!on;
 if(on)p.innerHTML=`<button onclick="go('musica')">🎵 ${MU.on?MU_STY[MU.style].n:esc(MU.playing||"Audio")}</button><button aria-label="Detener música" onclick="${MU.on?"muStop()":"audStop()"};muPill()">✕</button>`;
}

/* 3) Mis audios: MP3 guardados en este celular (IndexedDB) */
const AUD={db:null,el:null};
function audDB(){return new Promise((ok,ko)=>{if(AUD.db)return ok(AUD.db);const r=indexedDB.open("escuela-audios",1);r.onupgradeneeded=()=>r.result.createObjectStore("a",{keyPath:"id"});r.onsuccess=()=>{AUD.db=r.result;ok(AUD.db);};r.onerror=()=>ko(r.error);});}
async function audTx(mode,fn){const db=await audDB();return new Promise((ok,ko)=>{const tx=db.transaction("a",mode),s=tx.objectStore("a");const r=fn(s);tx.oncomplete=()=>ok(r&&r.result);tx.onerror=()=>ko(tx.error);});}
async function audLoad(){try{const all=await audTx("readonly",s=>s.getAll());MU.list=(all||[]).map(x=>({id:x.id,name:x.name,size:x.size,d:x.d})).sort((a,b)=>b.d-a.d);}catch(e){MU.list=[];MU.msg="No se pudieron leer los audios de este celular.";}if(view==="musica")render();}
async function audAdd(inp){
 const fs=[...(inp.files||[])];if(!fs.length)return;MU.msg="Guardando…";render();let n=0;
 for(const f of fs){if(!/^audio\//.test(f.type)&&!/\.(mp3|m4a|aac|wav|ogg|opus)$/i.test(f.name))continue;if(f.size>60e6){MU.msg=`«${f.name}» pesa más de 60 MB.`;continue;}
  try{await audTx("readwrite",s=>s.put({id:Date.now()+"-"+Math.random().toString(36).slice(2,7),name:f.name.replace(/\.[^.]+$/,""),size:f.size,d:Date.now(),blob:f}));n++;}catch(e){MU.msg="No hay espacio suficiente en el celular.";}}
 if(n)MU.msg=`${n} ${n===1?"audio guardado":"audios guardados"} en este celular.`;await audLoad();
}
async function audPlay(id){
 if(MU.on)muStop();const x=await audTx("readonly",s=>s.get(id));if(!x)return;
 if(!AUD.el){AUD.el=new Audio();AUD.el.addEventListener("ended",()=>{MU.playing=null;muPill();if(view==="musica")render();});}
 if(MU.url)URL.revokeObjectURL(MU.url);MU.url=URL.createObjectURL(x.blob);AUD.el.src=MU.url;MU.playing=x.name;MU.pid=id;
 try{await AUD.el.play();}catch(e){}muPill();render();
}
function audPause(){if(!AUD.el)return;if(AUD.el.paused)AUD.el.play();else AUD.el.pause();muPill();render();}
function audStop(){if(AUD.el){AUD.el.pause();}MU.playing=null;MU.pid=null;muPill();}
async function audDel(id){if(MU.pid===id)audStop();await audTx("readwrite",s=>s.delete(id));await audLoad();}
const mb=n=>(n/1e6).toFixed(1)+" MB";

 else if(T==="cantos"){const nq=bibNorm(MU.q.trim());const own=st.cantos||[];
  const secs=Object.entries(CANTOS).map(([m,L])=>[m,L.filter(t=>!nq||bibNorm(t+" "+m).includes(nq))]).filter(([m,L])=>L.length);
  body=`<p class="muted" style="margin:0 0 10px">Los cantos más conocidos en nuestras parroquias, por momento de la Misa. Toca para escucharlos en YouTube o Spotify y ensayar con el coro.</p>
  <div class="bibsearch"><input type="search" placeholder="Buscar canto…" value="${esc(MU.q)}" oninput="MU.q=this.value;clearTimeout(MU._t);MU._t=setTimeout(()=>{render();const e=document.querySelector('.mucantos input');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}},250)"></div>
  ${own.length?`<div class="dsec"><h2>Nuestros cantos</h2>${own.map((c,i)=>`<div class="canto"><span>${esc(c.t)}</span><span class="row" style="gap:6px">${c.u?`<a class="btn ghost" href="${esc(c.u)}" target="_blank" rel="noopener">Abrir</a>`:""}<a class="btn ghost" href="${ytUrl(c.t)}" target="_blank" rel="noopener">YouTube</a><button class="back" style="margin:0" onclick="st.cantos.splice(${i},1);saveLocal();render()" aria-label="Quitar">✕</button></span></div>`).join("")}</div>`:""}
  ${secs.map(([m,L])=>`<div class="dsec"><h2>${m}</h2>${L.map(t=>`<div class="canto"><span>${esc(t.replace(/ canto( para)? misa| canto$/i,""))}</span><span class="row" style="gap:6px"><a class="btn ghost" href="${ytUrl(t)}" target="_blank" rel="noopener">YouTube</a><a class="btn ghost" href="${spUrl(t)}" target="_blank" rel="noopener">Spotify</a></span></div>`).join("")}</div>`).join("")||'<p class="muted">No encontré ese canto.</p>'}
  <div class="sec"><h2>Agregar un canto del coro</h2><div class="fgrid"><label>Nombre<input type="text" id="caT" maxlength="80" placeholder="Ej. Canto a la Virgen del coro"></label><label>Enlace (opcional)<input type="url" id="caU" maxlength="300" placeholder="https://youtube.com/…"></label></div>
  <button class="btn red" style="margin-top:10px" onclick="const t=$('#caT').value.trim(),u=$('#caU').value.trim();if(!t)return;st.cantos=[...(st.cantos||[]),{t,u:/^https:\\/\\//.test(u)?u:''}];saveLocal();render()">Agregar</button></div>`;}
 else{if(MU.list===null){audLoad();body='<p class="muted">Cargando…</p>';}
  else body=`<p class="muted" style="margin:0 0 12px">Sube grabaciones del coro, cantos para ensayar o meditaciones. Se guardan solo en este celular y se escuchan sin internet.</p>
  <label class="btn red" style="display:inline-block;cursor:pointer">+ Agregar audios<input type="file" accept="audio/*" multiple hidden onchange="audAdd(this)"></label>
  <div class="ilist" style="margin-top:12px">${MU.list.map(a=>`<div class="it ${MU.pid===a.id?"ok":""}"><span><b>${esc(a.name)}</b> <small class="muted">${mb(a.size)}</small></span><span class="row" style="gap:6px">${MU.pid===a.id?`<button class="btn ghost" onclick="audPause()">${AUD.el&&!AUD.el.paused?"❚❚":"▶"}</button>`:`<button class="btn ghost" onclick="audPlay('${a.id}')">▶</button>`}<button class="back" style="margin:0" onclick="audDel('${a.id}')" aria-label="Borrar">✕</button></span></div>`).join("")||'<p class="muted">Todavía no tienes audios guardados.</p>'}</div>`;}
 return `<div class="eyebrow">Para orar y para el coro</div><h1 style="font-size:clamp(1.9rem,5vw,2.6rem);margin:6px 0 12px">Música</h1>
 <div class="chips jgsel" style="margin-bottom:14px">${tabs.map(([k,l])=>`<button class="chip ${T===k?"on":""}" onclick="MU.tab='${k}';MU.msg='';render()">${l}</button>`).join("")}</div>
 ${MU.msg?`<p class="muted">${esc(MU.msg)}</p>`:""}<div class="${T==="cantos"?"mucantos":""}">${body}</div>`;
}

const VIEWS={musica:()=>vMusica(),juego:()=>vJuego(),lectores:()=>vGuia('lectores'),acolitos:()=>vGuia('acolitos'),coro:()=>vGuia('coro'),descubrir:()=>vDescubrir(),yo:()=>vYo(),examenc:()=>vExamenc(),avisos:()=>vAvisos(),biblia:()=>vBiblia(),recursos:()=>vRecursos(),antes:()=>vAntes(),inicio:()=>vInicio(),modulos:()=>vModulos(),misa:()=>vMisa(),enfermos:()=>vEnfermos(),palabra:()=>vPalabra(),expo:()=>vExpo(),difuntos:()=>vDifuntos(),emergencias:()=>vEmerg(),rosario:()=>vRosario(),devocionario:()=>vDevoc(),tarjetas:()=>vTarjetas(),situaciones:()=>vSit(),ordena:()=>vOrd(),examen:()=>vExam(),equipo:()=>vEquipo(),rol:()=>vRol(),entrar:()=>vEntrar(),ministros:()=>vMinistros(),calendario:()=>vCalendario(),bendiciones:()=>vBendic()};
function render(){
  renderUser();
  const g0=groupOf(view); const g=g0||{id:"",v:[view]}; if(g0) lastIn[g.id]=view;
  if(!document.querySelector("#bnav .bnav-in"))buildNav();
  document.querySelectorAll("#bnav button").forEach(b=>b.setAttribute("aria-current",b.dataset.g===g.id));
  const sub=$("#subtabs");
  const gv=g.v.filter(v=>v!=="ministros"||esCoord());
  if(g.id==="descubrir"&&view!=="descubrir"){sub.hidden=false;sub.innerHTML=`<div class="crumb"><button onclick="go('descubrir')">← Descubrir</button><span>${VNAME[view]||""}</span></div>`;}
  else if(g.sub&&gv.length>1){sub.hidden=false;sub.innerHTML=gv.map(v=>`<button class="subtab" aria-pressed="${v===view}" onclick="go('${v}')">${VNAME[v]}</button>`).join("");}
  else {sub.hidden=true;sub.innerHTML="";}
  const ap=sub.querySelector('[aria-pressed="true"]'); if(ap) sub.scrollLeft=ap.offsetLeft-sub.offsetWidth/2+ap.offsetWidth/2;
  app.innerHTML=(VIEWS[view]||VIEWS.inicio)();
  if(view==="misa" && ms.mode==="ruta") msBind();
  miniUI();
  if(view==="rosario") roBind();
  if(view==="enfermos") enBind();
  const pt=document.getElementById("patronal"); if(pt) pt.textContent=patronalText();
  const nf=document.getElementById("nextFeast"); if(nf){const f=upcomingFeasts(1)[0]; nf.textContent="Próxima: "+f.n+", "+fmtShort(f.d);}
  try{const r=history.state&&history.state.root;history.replaceState(Object.assign(navState(),r?{root:1}:{}),"","#"+view);}catch(e){}
}
if(st.antesDay!==new Date().toDateString()){st.antes=[];}
applyTheme();
const h=(location.hash||"").slice(1); if(ALLV.includes(h)||h==="entrar") view=h;
try{const start=view;history.replaceState({v:"inicio",i:null,root:1},"","#inicio");history.pushState({v:"inicio",i:null},"","#inicio");if(start!=="inicio")history.pushState({v:start,i:null},"","#"+start);}catch(e){}
render();
</script>

<script>if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
