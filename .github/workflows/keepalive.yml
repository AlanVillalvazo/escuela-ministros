# Despierta a Supabase dos veces por semana para que el proyecto gratis no se pause.
# Usa solo la clave pública (anon) que ya está en config.js.
name: Mantener Supabase despierto
on:
  schedule:
    - cron: "17 14 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a Supabase
        run: |
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlvY29ocmJldHlxeG9udGxsYXp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzODQzNTUsImV4cCI6MjEwNjk2MDM1NX0.lxqgQF1BPepI6ULHHXFJ9nmCD8mco1c_8teC7pP8GNM"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" -X POST \
            "https://iocohrbetyqxontllazt.supabase.co/rest/v1/rpc/avisos_lista" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{"p_codigo":"despertar"}'
